<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Articles, newsletters and updates from Galea." />
  <title>Blog • Galea</title>

  <link rel="stylesheet" href="/assets/css/main.css" />
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Header include -->
  <div id="site-header"></div>

  <!-- Page intro band -->
  <section class="page-intro">
    <div class="container page-intro-inner">
      <p class="page-eyebrow">Resources</p>
      <h1 class="page-title">Blog</h1>
      <p class="page-intro-text">
        Product updates, newsletters, and articles by our team.
      </p>
    </div>
  </section>

  <main id="main">
    <!-- Filters -->
    <section class="section section-alt" id="filters" aria-label="Filter and search posts">
      <div class="container">
        <div class="blog-tools">
          <h2 class="section-title" style="margin-bottom:.25rem;">Browse</h2>
          <p class="section-subtext" style="margin:0;">
            Search or filter by type. Everything is in one place.
          </p>

          <div class="blog-chip-row" role="group" aria-label="Content filters">
            <button class="blog-chip is-active" type="button" data-filter="all">All</button>
            <button class="blog-chip" type="button" data-filter="blog">Blog</button>
            <button class="blog-chip" type="button" data-filter="newsletter">Newsletter</button>
            <button class="blog-chip" type="button" data-filter="update">Product update</button>
          </div>

          <div class="blog-search">
            <label class="sr-only" for="blogSearch">Search posts</label>
            <input id="blogSearch" class="blog-input" type="search" placeholder="Search (e.g., benchmarking, privacy…)" />
          </div>
        </div>
      </div>
    </section>

    <!-- One grid -->
    <section class="section" id="browse" aria-label="All posts">
      <div class="container">
        <div class="blog-grid" id="blogGridAll"></div>

        <div class="blog-empty" id="blogEmpty" hidden>
          <p class="blog-empty-title">No matches found.</p>
          <p class="blog-empty-text">Try a different term, or clear the filters to browse everything.</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer include -->
  <div id="site-footer"></div>

  <script src="/assets/js/includes.js"></script>

  <!-- Blog hub: data-driven render (like Research / Articles) -->
  <script>
    (function () {
      /**
       * Types supported by filters:
       * - "blog"
       * - "newsletter"
       * - "update"
       *
       * To feature a post: set featured: true
       * (turn it off by removing it or setting it to false)
       */
      const posts = [
        {
          title: "December Newsletter",
          excerpt: "Our final newsletter of 2025. Updates on our progress on platform improvements, particularly on benchmarking",
          date: "2025-12-01",
          type: "newsletter",
          tags: ["Newsletter", "Benchmarking", "2025"],
          url: "/resources/blog/newsletters/2025/december/",
          featured: true
        },
        {
          title: "November Newsletter",
          excerpt: "Information about an update coming on the 16th of November.",
          date: "2025-11-01",
          type: "newsletter",
          tags: ["Newsletter", "Update", "2025"],
          url: "/resources/blog/newsletters/2025/november/"
        },
        {
          title: "Test blog post for layout",
          excerpt: "Layout elements for a blog template.",
          date: "2026-01-10",
          type: "blog",
          tags: ["Ethics", "Design"],
          url: "/resources/blog/posts/2026/09-01-2026/"
        }
      ];

      const grid = document.getElementById("blogGridAll");
      const empty = document.getElementById("blogEmpty");
      const search = document.getElementById("blogSearch");
      const chips = Array.from(document.querySelectorAll(".blog-chip"));

      let activeType = "all";

      function norm(s){ return String(s || "").toLowerCase().trim(); }

      function safeDate(d){
        const x = new Date(d);
        return Number.isNaN(x.getTime()) ? new Date(0) : x;
      }

      function typeLabel(type){
        if (type === "blog") return "Blog";
        if (type === "newsletter") return "Newsletter";
        if (type === "update") return "Product update";
        return "Post";
      }

      function matches(post, q){
        if (!q) return true;
        const tagText = (post.tags || []).join(" ");
        const haystack = norm(
          post.title + " " +
          post.excerpt + " " +
          typeLabel(post.type) + " " +
          post.type + " " +
          tagText + " " +
          post.date
        );
        return haystack.includes(q);
      }

      function sortPosts(list){
        // Featured first, then newest -> oldest
        return list.sort((a, b) => {
          const af = a.featured ? 1 : 0;
          const bf = b.featured ? 1 : 0;
          if (bf !== af) return bf - af;
          return safeDate(b.date) - safeDate(a.date);
        });
      }

      function render(){
        const q = norm(search.value);

        const filtered = sortPosts(
          posts
            .filter(p => (activeType === "all" || p.type === activeType))
            .filter(p => matches(p, q))
            .slice() // avoid mutating original order unexpectedly
        );

        grid.innerHTML = "";

        if (filtered.length === 0){
          empty.hidden = false;
          return;
        }
        empty.hidden = true;

        filtered.forEach((p, idx) => {
          const isFeaturedCard = idx === 0 && !!p.featured; // only “Featured” label on first featured item
          const card = document.createElement("article");
          card.className = "blog-card" + (isFeaturedCard ? " blog-card-featured" : "");

          // Build tag pills (optional)
          const tagsHtml = (p.tags && p.tags.length)
            ? `<div class="blog-tag-row" aria-label="Tags">
                 ${p.tags.map(t => `<span class="blog-tag">${t}</span>`).join("")}
               </div>`
            : "";

          // Meta line: [Featured] • date • type
          const featuredPillHtml = isFeaturedCard ? `<span class="blog-pill">Featured</span><span class="blog-dot" aria-hidden="true"></span>` : "";
          const metaHtml = `
            <div class="blog-card-meta">
              ${featuredPillHtml}
              <time datetime="${p.date}">${formatDateISOToGB(p.date)}</time>
              <span class="blog-dot" aria-hidden="true"></span>
              <span>${typeLabel(p.type)}</span>
            </div>
          `;

          card.innerHTML = `
            <a class="blog-card-link" href="${p.url}">
              <div class="blog-card-top">
                ${metaHtml}
                <h2 class="blog-card-title">${p.title}</h2>
                <p class="blog-card-excerpt">${p.excerpt}</p>
              </div>
              ${tagsHtml}
            </a>
          `;

          grid.appendChild(card);
        });
      }

      function formatDateISOToGB(iso){
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return iso;
        return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
      }

      // Chip handling
      chips.forEach((chip) => {
        chip.addEventListener("click", () => {
          chips.forEach(c => c.classList.remove("is-active"));
          chip.classList.add("is-active");
          activeType = chip.dataset.filter || "all";
          render();
        });
      });

      search.addEventListener("input", render);

      render();
    })();
  </script>
</body>
</html>
