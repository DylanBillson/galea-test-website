  <a class="skip-link" href="#main">Skip to content</a>

  <div id="site-header"></div>

  <!-- Page intro band -->

          <div class="research-search">

    <!-- Grid -->

        <div class="research-empty" id="researchEmpty" hidden>

          <p class="research-empty-text">Try a different term (title, author, publication, or year).</p>
        </div>

    </section>

        {

          publicationtitle: "Medical Informatics & The Internet in Medicine",
          date: "2007",
          author: "C. D. BUCKINGHAM, A. AHMED & A. E. ADAMS",
          link: "/resources/research/papers/medinfo-07-cdb-published_0.pdf"
        },
        {
          title: "Improving mental health risk assessment using web-based decision support",
          publicationtitle: "Health Care Risk Report",
          date: "2007",
          author: "C.D.Buckingham",
          link: "/resources/research/papers/hcrr-published_0.pdf"
        },
        {
          title: "Psychological cue use and implications for a clinical decision support system",
          publicationtitle: "Medical Informatics and the Internet in Medicine",
          date: "2002",
          author: "C. D. BUCKINGHAM",
          link: "/resources/research/papers/medinfo-published-02.pdf",
          pinned: true
        },
        {
          title: "Representing the assessment process for psychodynamic psychotherapy within a computerized model of human classification.",

          date: "1997",
          author: "C.D.Buckingham & J. Birtle",
          link: "/resources/research/papers/bjmp-paper.pdf"
        }
      ];

      const grid = document.getElementById("researchGrid");
      const empty = document.getElementById("researchEmpty");
      const search = document.getElementById("researchSearch");

      function norm(s){ return String(s || "").toLowerCase().trim(); }

      function yearValue(d){
        const y = parseInt(String(d).replace(/[^\d]/g, ""), 10);
        return Number.isFinite(y) ? y : 0;
      }

      function matches(pub, q){
        if (!q) return true;
        const haystack = norm(
          pub.title + " " +
          pub.publicationtitle + " " +
          pub.author + " " +
          pub.date
        );
        return haystack.includes(q);
      }

      function render(){
        const q = norm(search.value);
        const filtered = publications
          .filter(p => matches(p, q))
          .sort((a, b) => {
            const ap = a.pinned ? 1 : 0;
            const bp = b.pinned ? 1 : 0;
            if (bp !== ap) return bp - ap;                 // pinned first
            return yearValue(b.date) - yearValue(a.date);  // then newest
          });

        grid.innerHTML = "";

        if (filtered.length === 0){
          empty.hidden = false;
          return;
        }
        empty.hidden = true;

        filtered.forEach((pub) => {
          const card = document.createElement("article");
          card.className = "research-card";

          card.innerHTML = `
            <div class="research-card-top">
              <div class="research-meta">
                <div class="research-meta-left">
                  ${pub.pinned ? `<span class="research-pill">Pinned</span>` : ``}
                </div>
                <span class="research-year">${yearValue(pub.date)}</span>
              </div>

              <h3 class="research-title">${pub.title}</h3>
              <p class="research-pub"><span>Publication:</span> ${pub.publicationtitle}</p>
              <p class="research-auth"><span>Author:</span> ${pub.author}</p>
            </div>

            <div class="research-actions">
              <a class="btn btn-secondary" href="${pub.link}" target="_blank" rel="noopener">
                Open PDF
              </a>
            </div>
          `;

          grid.appendChild(card);
        });
      }

      search.addEventListener("input", render);
      render();
    })();
  </script>
</body>
</html>
